[project]
name = "tgbot"
version = "0.1.0"
description = "Telegram group history bot"
readme = "PLAN.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.0,<23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgbot"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
